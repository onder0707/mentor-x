<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MENTOR-X AI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <div class="app-layout">
    <!-- Üst Başlık ve AI Çekirdeği -->
    <header class="app-header">
      <div class="ai-core" id="aiCore"></div>
      <div class="header-info">
        <h1>MENTOR-X</h1>
        <span class="status-badge">Çevrimiçi</span>
      </div>
    </header>

    <!-- Sekme İçi İçerikler (Tek Ekran) -->
    <main class="content-area">
      
      <!-- 1. SOHBET SEKMESİ -->
      <section id="chat-tab" class="tab-panel active">
        <div class="chat-box" id="chatBox">
          <div class="message bot">
            <div class="sender">MENTOR-X</div>
            <div class="text">Sistem aktif. Seni dinliyorum Önder.</div>
          </div>
        </div>
        <div class="input-area">
          <input type="text" id="userInput" placeholder="Mesajınızı yazın..." autocomplete="off">
          <button id="sendBtn">Gönder</button>
        </div>
      </section>

      <!-- 2. HAFIZA SEKMESİ -->
      <section id="memory-tab" class="tab-panel">
        <h2>Kalıcı Hafıza</h2>
        <div class="card">
          <label>Kullanıcı Adı</label>
          <input type="text" id="memName" value="Önder Kozak">
          
          <label>Profil Bilgileri & Detaylar</label>
          <textarea id="memDetails" rows="4">Yazılım, oyun geliştirme ve tarih ile ilgileniyor. Eşit Ağırlık öğrencisi.</textarea>
          
          <button id="saveMemoryBtn" class="action-btn">Hafızayı Kaydet</button>
        </div>
      </section>

      <!-- 3. AYARLAR SEKMESİ -->
      <section id="settings-tab" class="tab-panel">
        <h2>Sistem Ayarları</h2>
        <div class="card">
          <label>Gemini API Key</label>
          <input type="password" id="apiKeyInput" placeholder="API Key yapıştırın...">
          <button id="saveKeyBtn" class="action-btn">Key'i Kaydet</button>
        </div>
      </section>

    </main>

    <!-- Alt Navigasyon Menüsü -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="chat-tab">💬 Sohbet</button>
      <button class="nav-btn" data-tab="memory-tab">🧠 Hafıza</button>
      <button class="nav-btn" data-tab="settings-tab">⚙️ Ayarlar</button>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
